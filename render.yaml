services:
  - type: web
    name: alpha-ai
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile - --error-logfile - app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: API_ENCRYPTION_KEY
        generateValue: true
      - key: ALPHA_RUNTIME_BACKEND
        value: render
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKSPACE_ID
        sync: false
      - key: RENDER_SANDBOX_GROUP_ID
        sync: false
      - key: RENDER_SANDBOX_PLAN
        value: 1c-2g
      - key: ALPHA_SANDBOX_ENABLED
        value: "1"
